services:
  quiz-battle-service:
    image: akashmondal0/quiz-battle-service:1.0.0

    build:
      context: .
      dockerfile: Dockerfile

    container_name: quiz-battle-service

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5000:5000"

    environment:
      NODE_ENV: production

    networks:
      - quiz-network

networks:
  quiz-network:
    driver: bridge